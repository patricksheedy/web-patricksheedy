{{ define "main" }}
<div class="container py-3 mt-2">
  <div class="row justify-content-center">
    <div class="col-lg-9">
      <article class="post-content">
        <header class="mb-3">
          <h1 class="display-4 fw-bold mb-3">{{ .Title }}</h1>
        </header>

        <div class="content">
          {{ .Content }}
        </div>
      </article>
    </div>
  </div>
</div>
{{ end }}
